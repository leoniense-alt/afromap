<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable | AfroMap</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#5E2A8C">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 36'%3E%3Cpath d='M15 35C15 35 2 22.5 2 14a13 13 0 0 1 26 0c0 8.5-13 21-13 21Z' fill='%23D12864'/%3E%3C/svg%3E">
<style>
@font-face{font-family:"Bricolage Grotesque";font-weight:800;font-display:swap;src:url(/fonts/bricolage-grotesque-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-weight:400;font-display:swap;src:url(/fonts/figtree-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-weight:600;font-display:swap;src:url(/fonts/figtree-latin-600-normal.woff2) format("woff2")}
:root{--bg:#FBF6F3;--ink:#24132B;--muted:#6E5A72;--violet:#5E2A8C;--rose:#D12864;--line:#E7D7DF;--surface:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#140B17;--ink:#F6ECF2;--muted:#BBA6BF;--violet:#B98BEA;--rose:#FF6F9C;--line:#3A2640;--surface:#1E1222}}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:400 17px/1.6 Figtree,system-ui,sans-serif;padding:24px 16px}
main{max-width:560px;text-align:center;display:grid;gap:20px;justify-items:center}
.logo{display:inline-flex;align-items:center;gap:8px;font:800 1.3rem "Bricolage Grotesque",system-ui,sans-serif;color:var(--ink);text-decoration:none}
.logo b{color:var(--rose)}
.code{font:800 clamp(4rem,16vw,7rem)/1 "Bricolage Grotesque",system-ui,sans-serif;color:var(--violet);margin:8px 0 0}
h1{font:800 clamp(1.6rem,5vw,2.2rem)/1.15 "Bricolage Grotesque",system-ui,sans-serif;margin:0;letter-spacing:-.02em}
p{margin:0;color:var(--muted)}
.ctas{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:8px}
.btn{display:inline-flex;align-items:center;min-height:52px;padding:0 24px;border-radius:999px;font-weight:600;text-decoration:none;border:2px solid transparent}
.btn-rose{background:var(--rose);color:#fff}
.btn-ghost{border-color:var(--ink);color:var(--ink)}
.btn:focus-visible,.logo:focus-visible{outline:3px solid var(--violet);outline-offset:3px}
</style>
</head>
<body>
<main>
  <a class="logo" href="/" aria-label="AfroMap, accueil">
    <svg width="26" height="32" viewBox="0 0 30 36" aria-hidden="true"><path d="M15 35C15 35 2 22.5 2 14a13 13 0 0 1 26 0c0 8.5-13 21-13 21Z" fill="#D12864"/></svg>
    <span>Afro<b>Map</b></span>
  </a>
  <p class="code" aria-hidden="true">404</p>
  <h1>Cette adresse n’est pas (encore) sur la carte.</h1>
  <p>La page que vous cherchez n’existe pas ou a changé d’adresse. Les bonnes adresses, elles, vous attendent par ici.</p>
  <div class="ctas">
    <a class="btn btn-rose" href="/">Retour à l’accueil</a>
    <a class="btn btn-ghost" href="/commercants/">Espace commerçants</a>
  </div>
</main>
</body>
</html>
